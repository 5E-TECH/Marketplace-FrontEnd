# Sotuvchi kabineti (SPA). Backend stack'idagi Caddy TLS'ni ushlab turadi va
# `marketplace_edge` tarmog'i orqali shu konteynerga proxy qiladi
# (Elchi-Marketplace/deploy/Caddyfile → {$APP_DOMAIN}).
#
# Tarmoq backend stack'i ko'tarilganda yaratiladi, shuning uchun avval
# backend'ni ishga tushiring.
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL kerak — masalan https://api.elchimarket.uz/api/v1}
        # Domen hali yo'q va API HTTP orqali sinalayotgan bo'lsa `true`.
        VITE_ALLOW_INSECURE_API: ${VITE_ALLOW_INSECURE_API:-false}
    image: marketplace-frontend:latest
    restart: unless-stopped
    # Domen bo'lmasa SPA shu port orqali ochiladi (http://SERVER_IP:8080).
    # Domen qo'shilgach Caddy `frontend:8080` ga tarmoq orqali proxy qiladi
    # va bu portni yopib qo'ysa ham bo'ladi.
    ports:
      - "${FRONTEND_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      edge:
        aliases:
          - frontend

networks:
  edge:
    external: true
    name: marketplace_edge
