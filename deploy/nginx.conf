server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Konteyner healthcheck'i (Caddy TLS/xavfsizlik sarlavhalarini o'zi qo'yadi).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Vite hash'li fayl nomlarini beradi — mazmuni hech qachon o'zgarmaydi.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html keshlanmaydi, aks holda yangi deploy eski bundle'ga ishora qilardi.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: mavjud bo'lmagan yo'llar React router'ga topshiriladi.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
