name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bog'liqliklar (npm ci)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tiplar (tsc)
        run: npm run typecheck

      # E2E testlar mock javoblar ustida ishlaydi, shuning uchun backend
      # kontraktidagi o'zgarishni ular ushlamaydi — bu qadam ushlaydi.
      - name: Kontrakt tekshiruvi (endpoint yo'llari)
        run: npm run contract:check

      # `contract:check` faqat endpoint BOR-YO'Qligini biladi. Bu qadam
      # generatsiya qilingan tiplar sxema bilan bir xilligini tekshiradi;
      # `src/shared/api/contractAssertions.ts` esa ularni qo'lda yozilgan
      # model tiplariga taqqoslaydi. Ya'ni DTO maydoni nomi o'zgarsa
      # `typecheck` qadami qizil bo'ladi (C5.6 TC2).
      - name: Kontrakt tekshiruvi (generatsiya qilingan tiplar)
        run: npm run api:check

      - name: Ops script sintaksisi
        run: |
          node --check scripts/check-contract.mjs
          node --check scripts/generate-api.mjs
          node --check scripts/sync-contract.mjs

      - name: Build (production)
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com/api/v1

      - name: Nginx konfiguratsiyasini tekshirish
        run: >-
          docker run --rm
          -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginxinc/nginx-unprivileged:1.27-alpine nginx -t

      - name: Playwright brauzeri
        run: npx playwright install --with-deps chrome

      - name: E2E testlar (Playwright)
        run: npm run test:e2e

      - name: Xato bo'lsa hisobotni saqlash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-build-test
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      # Yetishmayotgan secret AYNAN nomi bilan aytiladi. Busiz nosozlik
      # rsync qadamida "Permission denied" bo'lib chiqadi va "secret yo'q"
      # bilan "kalit serverda ruxsat etilmagan" holatlari bir xil ko'rinadi.
      - name: Deploy secretlari tekshiruvi
        run: |
          missing=''
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            eval "value=\${$key:-}"
            [ -n "$value" ] || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::Deploy secretlari yo'q:$missing"
            echo "Qo'shing: Settings → Secrets and variables → Actions" >&2
            echo "  DEPLOY_HOST = server IP" >&2
            echo "  DEPLOY_USER = deploy" >&2
            echo "  DEPLOY_SSH_KEY = maxfiy kalitning base64 nusxasi (bir qatorli)" >&2
            echo "  DEPLOY_KNOWN_HOSTS = ssh-keyscan -H <IP> chiqishi" >&2
            exit 1
          fi

      - name: SSH konfiguratsiyasini tayyorlash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Kalit base64'dan to'g'ri ochilganini darhol tekshiramiz: secret'ga
          # qator uzilishi tushsa yoki xom matn qo'yilsa, xato shu yerda
          # tushunarli chiqadi, rsync ichida emas.
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1 || {
            echo "::error::DEPLOY_SSH_KEY buzuq — base64 emas yoki nusxalashda qator uzilishi tushgan"
            exit 1
          }

      # Eng ko'p uchraydigan nosozlik: kalit serverdagi authorized_keys da yo'q.
      # Buni rsync'dan OLDIN aniqlasak, xato bir qatorda tushunarli bo'ladi.
      - name: SSH ulanishini tekshirish
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              -o BatchMode=yes -o ConnectTimeout=15 \
              "$DEPLOY_USER@$DEPLOY_HOST" 'echo "SSH ulanishi OK: $(whoami)@$(hostname)"' || {
            echo "::error::Serverga SSH ulanib bo'lmadi. Ehtimoliy sabablar:"
            echo "  1) ochiq kalit /home/deploy/.ssh/authorized_keys ga qo'shilmagan" >&2
            echo "  2) DEPLOY_USER noto'g'ri (kutilgani: deploy)" >&2
            echo "  3) DEPLOY_KNOWN_HOSTS server kalitiga mos emas" >&2
            exit 1
          }

      # `docker image prune -f` deploy oxirida eski (endi tegsiz) image'ni
      # o'chiradi — ya'ni teg qo'yilmasa orqaga qaytish yo'li yo'qoladi.
      # DIQQAT: masofaviy buyruq HEREDOC bilan yuboriladi, bir qatorli
      # `'...'` bilan EMAS. Birinchi urinishda aynan shunday yozilgan edi va
      # ichidagi o'zbekcha apostrof (`yo'q`) qatorni erta yopib, buyruqni
      # buzgan. `continue-on-error: true` tufayli qadam jimgina "success"
      # ko'rsatdi, teg esa qo'yilmadi — 2026-09-21 deployda oldingi image
      # shu sabab yo'qoldi. Bu faylda matnga apostrof yozmang.
      - name: Hozirgi image'ni orqaga qaytish uchun teglash
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -eu
          if docker image inspect marketplace-frontend:latest >/dev/null 2>&1; then
            docker tag marketplace-frontend:latest marketplace-frontend:rollback-previous
            echo "Orqaga qaytish tegi qoyildi: marketplace-frontend:rollback-previous"
            docker image inspect marketplace-frontend:rollback-previous \
              --format 'Tasdiq: {{.Id}} {{.Created}}'
          else
            echo "Oldingi image topilmadi - birinchi deploy"
          fi
          REMOTE

      - name: Fayllarni serverga yuborish
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env.production' \
            --exclude '.env.production.bak*' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'playwright-report/' \
            --exclude 'test-results/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
                 -o ServerAliveInterval=30 -o ServerAliveCountMax=20" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/home/deploy/marketplace-frontend/"

      - name: Konteynerni yangilash
        run: |
          # Keepalive: build uzoq davom etadi va ulanish jim turadi.
          # Backend deploy'ida aynan shu sabab uzilishlar bo'lgan.
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" <<'REMOTE'
          set -euo pipefail
          cd /home/deploy/marketplace-frontend
          test -f .env.production

          # Backend stack'i `marketplace_edge` tarmog'ini yaratadi.
          docker network inspect marketplace_edge >/dev/null 2>&1 || {
            echo "XATO: marketplace_edge tarmog'i yo'q — avval backend stack'ini ko'taring"
            exit 1
          }

          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            up -d --build --remove-orphans

          # Konteyner haqiqatan javob berayotganini tasdiqlaymiz.
          healthy=false
          for attempt in $(seq 1 12); do
            if docker compose --env-file .env.production -f docker-compose.prod.yml \
                 exec -T frontend wget --quiet --tries=1 --spider http://127.0.0.1:8080/healthz; then
              healthy=true
              break
            fi
            echo "Kutilmoqda... ($attempt/12)"
            sleep 5
          done

          if [ "$healthy" != "true" ]; then
            echo "XATO: frontend konteyneri javob bermadi"
            docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail 50 frontend
            exit 1
          fi

          docker image prune -f
          echo "Deploy muvaffaqiyatli."
          REMOTE

      # Konteyner ichidagi healthcheck faqat konteyner tirikligini bildiradi.
      # Kabinet HAQIQATAN tashqaridan ochilayotganini Caddy/tunnel orqali
      # tekshiramiz — backend deploy'ida ham aynan shu qadam bor.
      - name: Tashqaridan tekshirish
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://admin.elchimarket.uz/healthz || true)
            if [ "$code" = "200" ]; then
              echo "Kabinet tashqaridan sog'lom ($code)"
              exit 0
            fi
            echo "Kutilmoqda... ($attempt/10, oxirgi javob: $code)"
            sleep 6
          done
          echo "::error::Kabinet tashqaridan javob bermadi. Konteyner ko'tarilgan, lekin Caddy yoki tunnel yo'lida muammo bor."
          exit 1
