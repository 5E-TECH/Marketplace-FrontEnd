name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bog'liqliklar (npm ci)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tiplar (tsc)
        run: npm run typecheck

      # E2E testlar mock javoblar ustida ishlaydi, shuning uchun backend
      # kontraktidagi o'zgarishni ular ushlamaydi — bu qadam ushlaydi.
      - name: Kontrakt tekshiruvi (endpoint yo'llari)
        run: npm run contract:check

      # `contract:check` faqat endpoint BOR-YO'Qligini biladi. Bu qadam
      # generatsiya qilingan tiplar sxema bilan bir xilligini tekshiradi;
      # `src/shared/api/contractAssertions.ts` esa ularni qo'lda yozilgan
      # model tiplariga taqqoslaydi. Ya'ni DTO maydoni nomi o'zgarsa
      # `typecheck` qadami qizil bo'ladi (C5.6 TC2).
      - name: Kontrakt tekshiruvi (generatsiya qilingan tiplar)
        run: npm run api:check

      - name: Ops script sintaksisi
        run: |
          node --check scripts/check-contract.mjs
          node --check scripts/generate-api.mjs
          node --check scripts/sync-contract.mjs

      - name: Build (production)
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com/api/v1

      - name: Nginx konfiguratsiyasini tekshirish
        run: >-
          docker run --rm
          -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginxinc/nginx-unprivileged:1.27-alpine nginx -t

      - name: Playwright brauzeri
        run: npx playwright install --with-deps chrome

      - name: E2E testlar (Playwright)
        run: npm run test:e2e

      - name: Xato bo'lsa hisobotni saqlash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-build-test
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH konfiguratsiyasini tayyorlash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Fayllarni serverga yuborish
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env.production' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'playwright-report/' \
            --exclude 'test-results/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
                 -o ServerAliveInterval=30 -o ServerAliveCountMax=20" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/home/deploy/marketplace-frontend/"

      - name: Konteynerni yangilash
        run: |
          # Keepalive: build uzoq davom etadi va ulanish jim turadi.
          # Backend deploy'ida aynan shu sabab uzilishlar bo'lgan.
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" <<'REMOTE'
          set -euo pipefail
          cd /home/deploy/marketplace-frontend
          test -f .env.production

          # Backend stack'i `marketplace_edge` tarmog'ini yaratadi.
          docker network inspect marketplace_edge >/dev/null 2>&1 || {
            echo "XATO: marketplace_edge tarmog'i yo'q — avval backend stack'ini ko'taring"
            exit 1
          }

          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            up -d --build --remove-orphans

          # Konteyner haqiqatan javob berayotganini tasdiqlaymiz.
          healthy=false
          for attempt in $(seq 1 12); do
            if docker compose --env-file .env.production -f docker-compose.prod.yml \
                 exec -T frontend wget --quiet --tries=1 --spider http://127.0.0.1:8080/healthz; then
              healthy=true
              break
            fi
            echo "Kutilmoqda... ($attempt/12)"
            sleep 5
          done

          if [ "$healthy" != "true" ]; then
            echo "XATO: frontend konteyneri javob bermadi"
            docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail 50 frontend
            exit 1
          fi

          docker image prune -f
          echo "Deploy muvaffaqiyatli."
          REMOTE
